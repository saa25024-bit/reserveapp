<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施設予約システム - reserveapp</title>
    <!-- Favicon data URI to eliminate 404 error -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📅</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass-effect {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-white text-indigo-600 p-2 rounded-lg shadow-md font-bold text-xl flex items-center justify-center">
                    <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight sm:text-xl">施設予約管理システム</h1>
                    <p class="text-xs text-indigo-200 hidden sm:block">体育館・実習室・会議室のオンライン予約</p>
                </div>
            </div>

            <!-- User Auth Profile Header Area -->
            <div id="userInfoHeader" class="hidden flex items-center space-x-3">
                <div class="flex items-center space-x-2 bg-indigo-700/60 px-3 py-1.5 rounded-full border border-indigo-500/30">
                    <img id="userAvatar" src="" alt="Profile" class="w-7 h-7 rounded-full object-cover bg-indigo-400">
                    <span id="userName" class="text-xs sm:text-sm font-medium max-w-[120px] sm:max-w-[180px] truncate">ユーザー</span>
                </div>
                <button id="logoutBtn" class="bg-indigo-700 hover:bg-indigo-800 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition-all shadow-sm flex items-center space-x-1 border border-indigo-400/30">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    <span class="hidden sm:inline">ログアウト</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Notification / Alert Banner -->
        <div id="toast" class="hidden mb-4 p-4 rounded-xl shadow-md border flex items-center justify-between transition-all duration-300">
            <div class="flex items-center space-x-3">
                <i id="toastIcon" class="fa-solid text-xl"></i>
                <p id="toastMessage" class="text-sm font-medium"></p>
            </div>
            <button onclick="hideToast()" class="text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <!-- 1. Login Required Screen -->
        <section id="loginSection" class="my-12 max-w-md mx-auto">
            <div class="bg-white rounded-2xl shadow-xl p-8 border border-slate-100 text-center">
                <div class="w-20 h-20 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-6 text-3xl shadow-inner">
                    <svg class="w-10 h-10 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                    </svg>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">ログインが必要です</h2>
                <p class="text-slate-500 text-sm mb-8">
                    施設予約を利用・閲覧するには、Googleアカウントでログインしてください。
                </p>

                <button id="googleLoginBtn" class="w-full bg-white hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 border border-slate-300 rounded-xl shadow-sm transition-all flex items-center justify-center space-x-3 group hover:shadow-md active:scale-[0.98]">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Google アカウントでログイン</span>
                </button>

                <div class="mt-6 pt-6 border-t border-slate-100 text-xs text-slate-400">
                    <p>Firebase Authentication (Google Identity) を使用しています。</p>
                </div>
            </div>
        </section>

        <!-- 2. Authenticated Dashboard (Displayed when logged in) -->
        <div id="appDashboard" class="hidden space-y-8">

            <!-- Top Grid: Reservation Form & Quick Stats -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

                <!-- Left Column: Booking Form -->
                <div class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between pb-4 mb-5 border-b border-slate-100">
                            <h2 class="text-lg font-bold text-slate-800 flex items-center space-x-2">
                                <i class="fa-solid fa-calendar-plus text-indigo-600"></i>
                                <span>新規予約の登録</span>
                            </h2>
                            <span class="text-xs text-indigo-600 bg-indigo-50 font-medium px-2.5 py-1 rounded-full">入力全5項目</span>
                        </div>

                        <form id="reservationForm" class="space-y-4">

                            <!-- 1. 施設名 (Facility Name) -->
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                                    1. 施設名 <span class="text-red-500">*</span>
                                </label>
                                <div class="relative">
                                    <select id="facilitySelect" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl p-2.5 pl-3 pr-8 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 appearance-none text-sm transition-all">
                                        <option value="">選択してください</option>
                                        <option value="体育館">体育館</option>
                                        <option value="実習室A">実習室A</option>
                                        <option value="実習室B">実習室B</option>
                                        <option value="会議室">会議室</option>
                                        <option value="講堂">講堂</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down absolute right-3 top-3.5 text-xs text-slate-400 pointer-events-none"></i>
                                </div>
                            </div>

                            <!-- 2. 利用日 (Usage Date) -->
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                                    2. 利用日 <span class="text-red-500">*</span>
                                </label>
                                <input type="date" id="dateInput" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                            </div>

                            <!-- 3. 利用時間帯 (Time Slot) -->
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                                    3. 利用時間帯 <span class="text-red-500">*</span>
                                </label>
                                <div class="relative">
                                    <select id="timeSlotSelect" required class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl p-2.5 pl-3 pr-8 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 appearance-none text-sm transition-all">
                                        <option value="">選択してください</option>
                                        <option value="1時間目 (08:50〜09:40)">1時間目 (08:50〜09:40)</option>
                                        <option value="2時間目 (09:50〜10:40)">2時間目 (09:50〜10:40)</option>
                                        <option value="3時間目 (10:50〜11:40)">3時間目 (10:50〜11:40)</option>
                                        <option value="4時間目 (11:50〜12:40)">4時間目 (11:50〜12:40)</option>
                                        <option value="5時間目 (13:30〜14:20)">5時間目 (13:30〜14:20)</option>
                                        <option value="6時間目 (14:30〜15:20)">6時間目 (14:30〜15:20)</option>
                                        <option value="7時間目 (15:30〜16:20)">7時間目 (15:30〜16:20)</option>
                                        <option value="放課後・部活動 (16:30〜18:00)">放課後・部活動 (16:30〜18:00)</option>
                                    </select>
                                    <i class="fa-solid fa-chevron-down absolute right-3 top-3.5 text-xs text-slate-400 pointer-events-none"></i>
                                </div>
                            </div>

                            <!-- 4. 予約者名 (Reserver Name - Auto-filled from Google login) -->
                            <div>
                                <div class="flex justify-between items-center mb-1">
                                    <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider">
                                        4. 予約者名 <span class="text-red-500">*</span>
                                    </label>
                                    <span class="text-[10px] text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded">ログイン情報から自動入力</span>
                                </div>
                                <input type="text" id="reserverNameInput" required placeholder="氏名を入力" class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all">
                            </div>

                            <!-- 5. 利用目的 (Purpose) -->
                            <div>
                                <label class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">
                                    5. 利用目的 <span class="text-red-500">*</span>
                                </label>
                                <textarea id="purposeInput" rows="3" required placeholder="例：体育の授業、ロボット演習課題、学級集会など" class="w-full bg-slate-50 border border-slate-300 text-slate-800 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all resize-none"></textarea>
                            </div>

                            <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-4 rounded-xl shadow-md transition-all flex items-center justify-center space-x-2 active:scale-[0.99] mt-2">
                                <i class="fa-solid fa-paper-plane"></i>
                                <span>予約を登録する</span>
                            </button>
                        </form>
                    </div>
                </div>

                <!-- Right Column: List and Filter Area -->
                <div class="lg:col-span-7 space-y-4">

                    <!-- Filter Controls Card -->
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                            <h3 class="font-bold text-slate-800 text-base flex items-center space-x-2">
                                <i class="fa-solid fa-filter text-indigo-600"></i>
                                <span>予約の一覧・絞り込み</span>
                            </h3>
                            <div class="text-xs text-slate-500 flex items-center space-x-2">
                                <span>該当件数:</span>
                                <span id="reservationCount" class="font-bold bg-slate-100 px-2 py-0.5 rounded-full text-slate-700">0件</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="block text-[11px] font-medium text-slate-500 mb-1">施設で絞り込み</label>
                                <select id="filterFacility" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs text-slate-700">
                                    <option value="">すべての施設</option>
                                    <option value="体育館">体育館</option>
                                    <option value="実習室A">実習室A</option>
                                    <option value="実習室B">実習室B</option>
                                    <option value="会議室">会議室</option>
                                    <option value="講堂">講堂</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-[11px] font-medium text-slate-500 mb-1">利用日で絞り込み</label>
                                <input type="date" id="filterDate" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs text-slate-700">
                            </div>
                        </div>

                        <div id="activeFilterBadge" class="hidden mt-3 pt-3 border-t border-slate-100 flex items-center justify-between text-xs">
                            <span class="text-indigo-600 font-medium">絞り込みフィルター適用中</span>
                            <button id="clearFilterBtn" class="text-slate-400 hover:text-slate-600 underline">フィルター解除</button>
                        </div>
                    </div>

                    <!-- Reservation Items List Container -->
                    <div id="reservationsListContainer" class="space-y-3 min-h-[350px]">
                        <!-- Dynamic content loaded here -->
                        <div class="bg-white rounded-2xl p-12 text-center text-slate-400 border border-slate-200/60 shadow-sm">
                            <i class="fa-solid fa-spinner fa-spin text-2xl mb-2 text-indigo-500"></i>
                            <p class="text-sm">予約データを読み込み中...</p>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </main>

    <!-- Edit Modal Dialog -->
    <div id="editModal" class="hidden fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-100 max-w-lg w-full p-6 space-y-4">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100">
                <h3 class="font-bold text-slate-800 text-lg flex items-center space-x-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-600"></i>
                    <span>予約の編集</span>
                </h3>
                <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="editForm" class="space-y-3">
                <input type="hidden" id="editDocId">

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">施設名</label>
                    <select id="editFacility" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                        <option value="体育館">体育館</option>
                        <option value="実習室A">実習室A</option>
                        <option value="実習室B">実習室B</option>
                        <option value="会議室">会議室</option>
                        <option value="講堂">講堂</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">利用日</label>
                    <input type="date" id="editDate" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">利用時間帯</label>
                    <select id="editTimeSlot" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                        <option value="1時間目 (08:50〜09:40)">1時間目 (08:50〜09:40)</option>
                        <option value="2時間目 (09:50〜10:40)">2時間目 (09:50〜10:40)</option>
                        <option value="3時間目 (10:50〜11:40)">3時間目 (10:50〜11:40)</option>
                        <option value="4時間目 (11:50〜12:40)">4時間目 (11:50〜12:40)</option>
                        <option value="5時間目 (13:30〜14:20)">5時間目 (13:30〜14:20)</option>
                        <option value="6時間目 (14:30〜15:20)">6時間目 (14:30〜15:20)</option>
                        <option value="7時間目 (15:30〜16:20)">7時間目 (15:30〜16:20)</option>
                        <option value="放課後・部活動 (16:30〜18:00)">放課後・部活動 (16:30〜18:00)</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">予約者名</label>
                    <input type="text" id="editReserverName" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-700 mb-1">利用目的</label>
                    <textarea id="editPurpose" rows="3" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2 text-sm resize-none"></textarea>
                </div>

                <div class="flex justify-end space-x-2 pt-2 border-t border-slate-100">
                    <button type="button" onclick="closeEditModal()" class="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-sm hover:bg-slate-200">キャンセル</button>
                    <button type="submit" class="px-4 py-2 bg-indigo-600 text-white rounded-lg text-sm hover:bg-indigo-700 font-semibold shadow-sm">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase Script Setup (ES Module Imports) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { 
            getAuth, 
            signInWithPopup, 
            signInWithRedirect,
            getRedirectResult,
            GoogleAuthProvider, 
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            getDocs, 
            onSnapshot, 
            doc, 
            deleteDoc, 
            updateDoc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Provided Firebase Config from Task Specification
        const firebaseConfig = {
            apiKey: "AIzaSyB6J9iZjB0zw6PQVyW34De_XbAP4CQcsPE",
            authDomain: "task-53f0a.firebaseapp.com",
            projectId: "task-53f0a",
            storageBucket: "task-53f0a.firebasestorage.app",
            messagingSenderId: "1007010664935",
            appId: "1:1007010664935:web:14b7d6c43a9035a06ead42",
            measurementId: "G-GVFS6HXQF7"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();

        // State Variables
        let currentUser = null;
        let allReservations = [];

        // DOM Element References
        const loginSection = document.getElementById("loginSection");
        const appDashboard = document.getElementById("appDashboard");
        const userInfoHeader = document.getElementById("userInfoHeader");
        const userName = document.getElementById("userName");
        const userAvatar = document.getElementById("userAvatar");
        const googleLoginBtn = document.getElementById("googleLoginBtn");
        const logoutBtn = document.getElementById("logoutBtn");

        const reservationForm = document.getElementById("reservationForm");
        const facilitySelect = document.getElementById("facilitySelect");
        const dateInput = document.getElementById("dateInput");
        const timeSlotSelect = document.getElementById("timeSlotSelect");
        const reserverNameInput = document.getElementById("reserverNameInput");
        const purposeInput = document.getElementById("purposeInput");

        const filterFacility = document.getElementById("filterFacility");
        const filterDate = document.getElementById("filterDate");
        const clearFilterBtn = document.getElementById("clearFilterBtn");
        const activeFilterBadge = document.getElementById("activeFilterBadge");
        const reservationsListContainer = document.getElementById("reservationsListContainer");
        const reservationCount = document.getElementById("reservationCount");

        // Set default date picker to today
        const today = new Date().toISOString().split('T')[0];
        if (dateInput) dateInput.value = today;

        // Check redirect result on load for browsers blocking popups
        getRedirectResult(auth).catch((error) => {
            console.warn("Redirect result handler:", error.message);
        });

        // Authentication State Observer
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                userName.textContent = user.displayName || user.email || "ユーザー";
                userAvatar.src = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(userName.textContent)}&background=6366f1&color=fff`;
                
                // Auto-fill Reserver Name from logged-in user profile
                if (user.displayName) {
                    reserverNameInput.value = user.displayName;
                }

                loginSection.classList.add("hidden");
                appDashboard.classList.remove("hidden");
                userInfoHeader.classList.remove("hidden");

                showToast("ログインしました", "success");
                
                // Listen to real-time updates from Firestore
                listenToReservations();
            } else {
                currentUser = null;
                loginSection.classList.remove("hidden");
                appDashboard.classList.add("hidden");
                userInfoHeader.classList.add("hidden");
            }
        });

        // Google Login Handler (Handles popup block & Cross-Origin-Opener-Policy seamlessly)
        googleLoginBtn.addEventListener("click", async () => {
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                console.warn("Popup blocked or COOP error. Falling back to redirect auth:", error);
                // Fallback to redirect authentication if popup is blocked or restricted
                if (error.code === 'auth/popup-blocked' || error.code === 'auth/popup-closed-by-user' || error.message.includes('Cross-Origin-Opener-Policy')) {
                    try {
                        await signInWithRedirect(auth, googleProvider);
                    } catch (redirectError) {
                        showToast("ログインエラー: " + redirectError.message, "error");
                    }
                } else {
                    showToast("ログインに失敗しました: " + error.message, "error");
                }
            }
        });

        // Logout Handler
        logoutBtn.addEventListener("click", async () => {
            try {
                await signOut(auth);
                showToast("ログアウトしました", "info");
            } catch (error) {
                console.error("Logout Error:", error);
            }
        });

        // Realtime Firestore Listener
        function listenToReservations() {
            // Using standard artifacts collection path structure or direct reservations collection
            const appId = typeof __app_id !== 'undefined' ? __app_id : 'reserveapp-default';
            const reservationsRef = collection(db, 'artifacts', appId, 'public', 'data', 'reservations');

            onSnapshot(reservationsRef, (snapshot) => {
                allReservations = [];
                snapshot.forEach((docSnap) => {
                    allReservations.push({
                        id: docSnap.id,
                        ...docSnap.data()
                    });
                });

                // Sort by usage date then time slot in client side
                allReservations.sort((a, b) => {
                    if (a.date !== b.date) return a.date.localeCompare(b.date);
                    return a.timeSlot.localeCompare(b.timeSlot);
                });

                renderReservations();
            }, (error) => {
                console.error("Firestore Listen Error:", error);
                showToast("データの受信に失敗しました", "error");
            });
        }

        // Form Submission (Add New Reservation)
        reservationForm.addEventListener("submit", async (e) => {
            e.preventDefault();

            const facility = facilitySelect.value.trim();
            const date = dateInput.value;
            const timeSlot = timeSlotSelect.value.trim();
            const reserverName = reserverNameInput.value.trim();
            const purpose = purposeInput.value.trim();

            // Validation check
            if (!facility || !date || !timeSlot || !reserverName || !purpose) {
                showToast("すべての必須項目を入力してください。", "warning");
                return;
            }

            // Advanced Feature: Duplicate booking prevention (same facility + date + timeSlot)
            const isDuplicate = allReservations.some(item => 
                item.facility === facility && 
                item.date === date && 
                item.timeSlot === timeSlot
            );

            if (isDuplicate) {
                showToast(`【重複エラー】${facility} は ${date} の ${timeSlot} に既に予約されています。別の時間帯または施設を選択してください。`, "error");
                return;
            }

            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'reserveapp-default';
                const reservationsRef = collection(db, 'artifacts', appId, 'public', 'data', 'reservations');

                await addDoc(reservationsRef, {
                    facility,
                    date,
                    timeSlot,
                    reserverName,
                    purpose,
                    userId: currentUser ? currentUser.uid : "anonymous",
                    userEmail: currentUser ? currentUser.email : "",
                    createdAt: new Date().toISOString()
                });

                showToast("予約を正常に登録しました！", "success");
                
                // Clear purpose input only, keeping user name and default date
                purposeInput.value = "";
                facilitySelect.value = "";
                timeSlotSelect.value = "";

            } catch (error) {
                console.error("Add Doc Error:", error);
                showToast("登録に失敗しました: " + error.message, "error");
            }
        });

        // Filter Handlers
        filterFacility.addEventListener("change", renderReservations);
        filterDate.addEventListener("change", renderReservations);
        clearFilterBtn.addEventListener("click", () => {
            filterFacility.value = "";
            filterDate.value = "";
            renderReservations();
        });

        // Render List Function
        function renderReservations() {
            const facFilter = filterFacility.value;
            const dateFilt = filterDate.value;

            if (facFilter || dateFilt) {
                activeFilterBadge.classList.remove("hidden");
            } else {
                activeFilterBadge.classList.add("hidden");
            }

            const filtered = allReservations.filter(item => {
                const matchFac = !facFilter || item.facility === facFilter;
                const matchDate = !dateFilt || item.date === dateFilt;
                return matchFac && matchDate;
            });

            reservationCount.textContent = `${filtered.length}件`;

            if (filtered.length === 0) {
                reservationsListContainer.innerHTML = `
                    <div class="bg-white rounded-2xl p-10 text-center border border-slate-200/60 shadow-sm">
                        <i class="fa-solid fa-calendar-xmark text-4xl text-slate-300 mb-3"></i>
                        <p class="text-slate-500 font-medium text-sm">該当する予約情報がありません</p>
                        <p class="text-xs text-slate-400 mt-1">条件を変更するか、新規予約を行ってください。</p>
                    </div>
                `;
                return;
            }

            reservationsListContainer.innerHTML = filtered.map(item => {
                const isOwner = currentUser && (currentUser.uid === item.userId || currentUser.email === item.userEmail);
                
                // Badge color based on facility
                let badgeColor = "bg-indigo-100 text-indigo-700 border-indigo-200";
                if (item.facility === "体育館") badgeColor = "bg-emerald-100 text-emerald-700 border-emerald-200";
                if (item.facility.includes("実習室")) badgeColor = "bg-sky-100 text-sky-700 border-sky-200";
                if (item.facility === "会議室") badgeColor = "bg-amber-100 text-amber-700 border-amber-200";

                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 hover:shadow-md transition-all group">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 pb-3 mb-3 border-b border-slate-100">
                            <div class="flex items-center space-x-2">
                                <span class="px-3 py-1 rounded-full text-xs font-bold border ${badgeColor}">
                                    <i class="fa-solid fa-location-dot mr-1"></i>${escapeHtml(item.facility)}
                                </span>
                                <span class="text-xs text-slate-500 font-medium bg-slate-100 px-2.5 py-1 rounded-md">
                                    <i class="fa-regular fa-clock mr-1"></i>${escapeHtml(item.timeSlot)}
                                </span>
                            </div>
                            <div class="text-xs font-semibold text-slate-600 flex items-center space-x-1">
                                <i class="fa-regular fa-calendar text-indigo-500"></i>
                                <span>${escapeHtml(item.date)}</span>
                            </div>
                        </div>

                        <div class="space-y-1.5 mb-4">
                            <div class="flex items-start space-x-2">
                                <span class="text-xs font-semibold text-slate-400 w-16 shrink-0">予約者:</span>
                                <span class="text-xs font-bold text-slate-700 flex items-center">
                                    <i class="fa-regular fa-user mr-1 text-slate-400"></i>${escapeHtml(item.reserverName)}
                                </span>
                            </div>
                            <div class="flex items-start space-x-2">
                                <span class="text-xs font-semibold text-slate-400 w-16 shrink-0">目的:</span>
                                <p class="text-xs text-slate-600 bg-slate-50 p-2 rounded-lg w-full border border-slate-100 whitespace-pre-line">${escapeHtml(item.purpose)}</p>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex justify-end space-x-2 pt-1 border-t border-slate-50">
                            <button onclick="openEditModal('${item.id}')" class="px-2.5 py-1 text-xs text-slate-600 hover:text-indigo-600 hover:bg-indigo-50 rounded-md border border-slate-200 transition-all flex items-center space-x-1">
                                <i class="fa-solid fa-pen"></i>
                                <span>編集</span>
                            </button>
                            <button onclick="deleteReservation('${item.id}')" class="px-2.5 py-1 text-xs text-red-600 hover:bg-red-50 rounded-md border border-red-200 transition-all flex items-center space-x-1">
                                <i class="fa-solid fa-trash-can"></i>
                                <span>削除</span>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Delete Function
        window.deleteReservation = async function(id) {
            // UI Toast confirmation instead of alert/confirm
            showToast("予約を削除しています...", "info");
            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'reserveapp-default';
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'reservations', id);
                await deleteDoc(docRef);
                showToast("予約を削除しました", "success");
            } catch (error) {
                console.error("Delete Error:", error);
                showToast("削除に失敗しました: " + error.message, "error");
            }
        };

        // Edit Modal Opening Function
        window.openEditModal = function(id) {
            const target = allReservations.find(r => r.id === id);
            if (!target) return;

            document.getElementById("editDocId").value = target.id;
            document.getElementById("editFacility").value = target.facility;
            document.getElementById("editDate").value = target.date;
            document.getElementById("editTimeSlot").value = target.timeSlot;
            document.getElementById("editReserverName").value = target.reserverName;
            document.getElementById("editPurpose").value = target.purpose;

            document.getElementById("editModal").classList.remove("hidden");
        };

        window.closeEditModal = function() {
            document.getElementById("editModal").classList.add("hidden");
        };

        // Submit Edit Form
        document.getElementById("editForm").addEventListener("submit", async (e) => {
            e.preventDefault();

            const id = document.getElementById("editDocId").value;
            const facility = document.getElementById("editFacility").value;
            const date = document.getElementById("editDate").value;
            const timeSlot = document.getElementById("editTimeSlot").value;
            const reserverName = document.getElementById("editReserverName").value.trim();
            const purpose = document.getElementById("editPurpose").value.trim();

            // Duplicate check excluding current document
            const isDuplicate = allReservations.some(item => 
                item.id !== id &&
                item.facility === facility && 
                item.date === date && 
                item.timeSlot === timeSlot
            );

            if (isDuplicate) {
                showToast(`【重複エラー】${facility} は ${date} の ${timeSlot} に既に他の予約が入っています。`, "error");
                return;
            }

            try {
                const appId = typeof __app_id !== 'undefined' ? __app_id : 'reserveapp-default';
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'reservations', id);
                
                await updateDoc(docRef, {
                    facility,
                    date,
                    timeSlot,
                    reserverName,
                    purpose,
                    updatedAt: new Date().toISOString()
                });

                closeEditModal();
                showToast("予約情報を更新しました！", "success");
            } catch (error) {
                console.error("Update Error:", error);
                showToast("更新に失敗しました: " + error.message, "error");
            }
        });

        // Notification Toast System
        window.showToast = function(msg, type = "info") {
            const toast = document.getElementById("toast");
            const toastMessage = document.getElementById("toastMessage");
            const toastIcon = document.getElementById("toastIcon");

            toastMessage.textContent = msg;
            toast.className = "mb-4 p-4 rounded-xl shadow-md border flex items-center justify-between transition-all duration-300 ";

            if (type === "success") {
                toast.classList.add("bg-emerald-50", "border-emerald-200", "text-emerald-800");
                toastIcon.className = "fa-solid fa-circle-check text-emerald-600 text-xl";
            } else if (type === "error") {
                toast.classList.add("bg-red-50", "border-red-200", "text-red-800");
                toastIcon.className = "fa-solid fa-triangle-exclamation text-red-600 text-xl";
            } else if (type === "warning") {
                toast.classList.add("bg-amber-50", "border-amber-200", "text-amber-800");
                toastIcon.className = "fa-solid fa-circle-exclamation text-amber-600 text-xl";
            } else {
                toast.classList.add("bg-indigo-50", "border-indigo-200", "text-indigo-800");
                toastIcon.className = "fa-solid fa-circle-info text-indigo-600 text-xl";
            }

            toast.classList.remove("hidden");
            setTimeout(() => {
                hideToast();
            }, 5000);
        };

        window.hideToast = function() {
            document.getElementById("toast").classList.add("hidden");
        };

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
